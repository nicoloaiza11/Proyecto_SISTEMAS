{% comment %}Campo de formulario con etiqueta y errores. Requiere: field{% endcomment %}
<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label small fw-semibold">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
</div>
